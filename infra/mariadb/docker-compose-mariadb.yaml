services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb-local
    restart: unless-stopped
    hostname: mariadb-local
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=1G --innodb-file-per-table=1 --innodb-log-buffer-size=32M --innodb-log-file-size=256M --max-connections=200 --skip-name-resolve --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      --ssl --ssl-ca=/etc/mysql/ssl/localhost.crt --ssl-cert=/etc/mysql/ssl/localhost.crt --ssl-key=/etc/mysql/ssl/localhost.key

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UDAN_DB_PASSWORD: ${UDAN_DB_PASSWORD}  # used by init/01-create-databases.sh
      TZ: UTC

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - mariadb_data:/var/lib/mysql
      - ./config:/etc/mysql/conf.d:ro
      - ./logs:/var/log/mysql
      - ../nginx/localhost:/etc/mysql/ssl:ro

    networks:
      uda-network:
        aliases:
          - mariadb-local
          - mariadb.local
          - maria.db

    security_opt:
      - no-new-privileges:true

    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

    healthcheck:
      # $$ keeps Compose from expanding the variable: the container's shell reads it from its own environment,
      # so the password is not written into the health check config (docker inspect).
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$$UDAN_DB_PASSWORD\" mysqladmin ping -h localhost -u udan" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  uda-network:
    external: true

volumes:
  mariadb_data:
    driver: local
