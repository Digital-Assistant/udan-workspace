# Enable Gzip compression
gzip on;

# Specify the MIME types to compress
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/vnd.wap.wml image/svg+xml;

# Enable compression for proxied requests
gzip_proxied any;

# Set the compression level (1-9, with 9 being the highest compression)
gzip_comp_level 6;

# Vary header for proxied compressed responses
gzip_vary on;

# Disable sending ETag headers for static content
etag off;

# Configure FastCGI buffers
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;

# Configure proxy buffers
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# Enable caching for static files
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=30d use_temp_path=off;

# Configure caching rules
proxy_cache_key "$scheme$request_method$host$request_uri";
proxy_cache_valid 200 302 304 1d;
proxy_cache_valid 404 1m;
proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
