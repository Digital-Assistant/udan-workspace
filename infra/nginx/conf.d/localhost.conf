server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    #reference https://gist.github.com/nrollr/9a39bb636a820fb97eec2ed85e473d38

    # Improve HTTPS performance with session resumption
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Enable server-side protection against BEAST attacks
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    # ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # ref: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options
    add_header X-Frame-Options DENY always;

    # ref: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
    # add_header X-Content-Type-Options nosniff always;

    # ref: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
    # add_header X-Xss-Protection "1; mode=block" always;

    # ssl_stapling disabled for local dev (self-signed cert has no OCSP issuer)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # Local-only development host names (see infra/nginx/README.md).
    server_name udan-sdk.nistapp localhost;

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Credentials' 'true';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        return 200 '<html><body><h2>UDAN local environment</h2><p>nginx is running.</p></body></html>';
        add_header Content-Type text/html;
    }

    location ~ \.(ico|pdf|flv|jpg|jpeg|png|gif|js|css|swf|woff)$ {
        expires 86400;
        add_header Cache-Control "max-age=86400, public, immutable";
        access_log off;
    }
}

# Server blocks from other repositories. Whole `server { ... }` files go in extra/.
# This file is itself included at http level, so the include is valid here.
# An empty folder (or no match) is fine: nginx ignores a wildcard that matches nothing.
include /etc/nginx/conf.d/extra/*.conf;
