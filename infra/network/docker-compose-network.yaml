
networks:
  uda-network:
    name: uda-network
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: uda-network
      com.docker.network.bridge.enable_icc: "true"
      encrypt: "true"
    enable_ipv6: false
