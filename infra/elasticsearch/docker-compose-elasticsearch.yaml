
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
    container_name: elasticsearch-local
    hostname: elasticsearch-local
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - bootstrap.memory_lock=true
      - "discovery.type=single-node"
      # 1g so a TEST/PROD-sized dataset can be re-indexed locally (256m trips the circuit breaker).
      # bootstrap.memory_lock keeps the heap in RAM, so this takes 1 GB from the machine.
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - uda-network
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "100m"
networks:
  uda-network:
    external: true
volumes:
  elasticsearch_data:
    driver: local
